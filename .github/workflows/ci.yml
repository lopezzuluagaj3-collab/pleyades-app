name: 'Pleyades App DevSecOps Pipeline'

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/**'
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/**'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================
  # 1. Detección de Fuga de Secretos (Gitleaks)
  # =========================================================
  secret-scan:
    name: '1. Secret Leak Detection (Gitleaks)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Instalar y ejecutar Gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v8.24.0 --repo gitleaks/gitleaks --pattern 'gitleaks_8.24.0_linux_x64.tar.gz'
          tar -xzf gitleaks_8.24.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source=. --verbose --redact

  # =========================================================
  # 2. Calidad de Código, Buenas Prácticas y SAST (golangci-lint + gosec)
  # =========================================================
  lint-and-quality:
    name: '2. Code Quality & SAST (golangci-lint)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar entorno de Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ejecutar golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config=.golangci.yml

  # =========================================================
  # 3. Pruebas Unitarias y Cobertura de Código
  # =========================================================
  unit-tests:
    name: '3. Unit Tests & Code Coverage'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar entorno de Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ejecutar Pruebas y Generar Perfil de Cobertura
        run: |
          go test -v -coverprofile=coverage.out ./...

      - name: Mostrar reporte de cobertura en consola
        run: |
          go tool cover -func=coverage.out

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-coverage-report
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  # =========================================================
  # 4. Análisis de Vulnerabilidades en Dependencias (SCA)
  # =========================================================
  dependency-scan:
    name: '4. Dependency Vulnerability Scan (govulncheck & Trivy)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar entorno de Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ejecutar Govulncheck (Escáner Oficial de Go)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: 'go.mod'
          package-path: './...'

      - name: Escanear Sistema de Archivos y Dependencias con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-fs-report.txt'

      - name: Mostrar reporte de Trivy en consola
        run: |
          cat trivy-fs-report.txt

      - name: Subir reporte de dependencias de Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt
          if-no-files-found: warn
          retention-days: 14

  # =========================================================
  # 5. Verificación de Compilación de Imagen Docker y Escaneo de Seguridad (Trivy)
  # =========================================================
  docker-build:
    name: '5. Docker Build & Container Security (Trivy)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compilar imagen Docker de producción
        run: |
          docker build -t pleyades-app:ci .
          docker images pleyades-app:ci

      - name: Escanear imagen de contenedor con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'pleyades-app:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-image-report.txt'

      - name: Mostrar reporte de Trivy en consola
        run: |
          cat trivy-image-report.txt

      - name: Subir reporte de seguridad de imagen como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-container-image-report
          path: trivy-image-report.txt
          if-no-files-found: warn
          retention-days: 14

  # =========================================================
  # 6. Seguridad Dinámica DAST (OWASP ZAP API Scan)
  # =========================================================
  dast-security:
    name: '6. Dynamic Application Security Testing (OWASP ZAP)'
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pleyades
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: pleyades_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar entorno de Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Iniciar microservicio efímero en segundo plano
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: pleyades
          DB_PASSWORD: secret
          DB_NAME: pleyades_main
          DB_SSLMODE: disable
          SERVER_PORT: '8080'
          JWT_SECRET: devsecops-super-secret-key-32-chars-long
        run: |
          go build -o /tmp/pleyades-api ./cmd/pleyades-app
          /tmp/pleyades-api &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/healthz; then
              echo "API lista y respondiendo en el puerto 8080"
              break
            fi
            echo "Esperando arranque del servidor..."
            sleep 1
          done

      - name: Ejecutar OWASP ZAP API Scan (DAST)
        run: |
          docker run --rm --network="host" -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:8080/swagger/doc.json \
            -f openapi \
            -r zap_report.html \
            -w zap_report.md || true

      - name: Subir reporte de seguridad DAST (OWASP ZAP)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-dast-report
          path: |
            zap_report.html
            zap_report.md
          if-no-files-found: warn
          retention-days: 14
