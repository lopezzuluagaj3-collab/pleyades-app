# =========================================================
# Proyecto Pléyades - Configuración de Calidad y Linting (golangci-lint v2)
# =========================================================
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec        # SAST: Analiza el AST de Go buscando vulnerabilidades de seguridad

formatters:
  enable:
    - gofmt        # Valida que el código cumpla con el formateo estándar de Go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
